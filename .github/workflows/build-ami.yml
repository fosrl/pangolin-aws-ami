name: Build AMIs

# on:
#   workflow_dispatch:
#     inputs:
#       builds:
#         description: "Builds to run (comma separated: community-amd64,community-arm64,enterprise-amd64,enterprise-arm64)"
#         default: "community-amd64,community-arm64,enterprise-amd64,enterprise-arm64"
#       ami_public:
#         description: "Make the AMIs public"
#         type: boolean
#         default: false
#       ami_regions:
#         description: 'Regions to publish to, as a JSON list (e.g. ["us-east-1","eu-central-1"]). Empty = all default regions; [] = build region only.'
#         default: ""
#   # Monthly rebuild so new launches start from a patched OS and Docker.
#   # Pangolin itself is not baked in, so releases do not require a rebuild.
#   schedule:
#     - cron: "0 6 1 * *"
#   pull_request:
#     paths: ["**.pkr.hcl", "files/**", "scripts/**", "cloudformation/**", ".github/workflows/build-ami.yml"]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PACKER_VERSION: "1.11.2"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      - run: packer init .
      - run: packer fmt -check -diff .
      - run: packer validate .
      - name: shellcheck
        run: |
          shellcheck files/usr/local/sbin/pangolin-setup files/etc/update-motd.d/99-pangolin \
            files/etc/profile.d/pangolin-setup.sh scripts/*.sh examples/launch.sh

  matrix:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.set.outputs.builds }}
    steps:
      - id: set
        env:
          BUILDS: ${{ inputs.builds || 'community-amd64,community-arm64,enterprise-amd64,enterprise-arm64' }}
        run: echo "builds=$(jq -cn --arg b "$BUILDS" '$b | split(",") | map(gsub("\\s"; ""))')" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.matrix.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PACKER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      - run: packer init .
      - name: packer build
        env:
          PKR_VAR_region: ${{ env.AWS_REGION }}
          PKR_VAR_ami_public: ${{ inputs.ami_public || false }}
          PKR_VAR_ami_version: ${{ github.run_number }}-${{ github.run_attempt }}
          AMI_REGIONS: ${{ inputs.ami_regions }}
        run: |
          # Only override the region list when one was given; otherwise use the template default.
          if [ -n "$AMI_REGIONS" ]; then export PKR_VAR_ami_regions="$AMI_REGIONS"; fi
          packer build -color=false -only="pangolin.amazon-ebs.${{ matrix.build }}" .
      - name: Summary
        run: |
          jq -r '.builds[] | "| \(.custom_data.edition) | \(.custom_data.arch) | \(.artifact_id) |"' manifest.json > rows.md
          { echo "| Edition | Arch | AMIs (region:id) |"; echo "|---|---|---|"; cat rows.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.build }}
          path: manifest.json
